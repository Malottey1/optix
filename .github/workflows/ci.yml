# Default Python tests, then the web dashboard's lint, typecheck, unit tests and build; the Docker
# image is built (not pushed) and the Bicep is compiled.
# No secrets; no deploy; no live Azure calls (the azure_live tests skip without Azure settings, and
# CI sets none). The slow tests (multi-seed, full league, headless browser) stay local.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt -r requirements-azure.txt
      - run: python -m tools.secret_scan
      - run: python -m pytest -q -rs

  web:
    needs: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Infrastructure is built and linted only: no registry login, no push, no `az login`, no deploy.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (not pushed)
        run: docker build --tag optix:ci .
      - name: container answers /healthz
        run: |
          docker run --detach --name optix-ci --publish 127.0.0.1:8000:8000 optix:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs optix-ci; exit 1

  bicep-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Bicep for the preinstalled Azure CLI
        run: az bicep install
      - name: az bicep build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: az bicep build-params
        run: az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
